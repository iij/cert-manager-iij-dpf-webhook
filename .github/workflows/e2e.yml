# SPDX-License-Identifier: Apache-2.0
#
# 実環境での検証 (憲章「実環境での検証」/ tasks.md T119, T120, T124)。
# 実行ごとに kind のクラスタを作り、cert-manager と、同じ実行で作ったイメージを用いた本チャートを
# 導入する。手順は手元と同じ Makefile の e2e-* ターゲット (scripts/e2e-kind.sh) を用い、版は Makefile
# が持つ。検証用ゾーンを共有するため並列に実行せず、後続の実行を待たせる。
# 証明書の取得まで確かめる e2e の ACME サーバは test/e2e/acmeserver が決める (既定はステージング
# 環境)。本番環境の値を本ファイルに置かない。
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-dpf-test-zone
  cancel-in-progress: false

env:
  HELM_VERSION: v4.2.2
  E2E_IMAGE: cert-manager-iij-dpf-webhook:e2e
  # e2e-* ターゲットの kubeconfig。後続の kubectl もこれを用いる。
  KUBECONFIG: ${{ github.workspace }}/.e2e/kubeconfig
  E2E_KUBECONFIG: ${{ github.workspace }}/.e2e/kubeconfig

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: クラスタの準備 (イメージのビルド・cert-manager と本チャートの導入)
        env:
          DPF_API_TOKEN: ${{ secrets.DPF_API_TOKEN }}
        run: make e2e-up E2E_IMAGE="$E2E_IMAGE" REVISION="${GITHUB_SHA}"

      - name: 起動時の挙動 - 必須設定の不足で異常終了する
        run: |
          set +e
          out="$(docker run --rm "$E2E_IMAGE" 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q 'DPF_WEBHOOK_LOCK_OWNER is required' <<<"$out"

      - name: 起動時の挙動 - webhook は平文で待ち受けない
        run: |
          kubectl -n cert-manager port-forward deploy/dpf-webhook 10443:10443 >/dev/null 2>&1 &
          sleep 5
          body="$(curl -sS --max-time 10 http://127.0.0.1:10443/ || true)"
          echo "$body"
          # TLS の待ち受けに平文で接続すると、Go の TLS サーバは要求を処理せずこの応答を返す。
          grep -q 'HTTP request to an HTTPS server' <<<"$body"

      - name: クライアント証明書の検証 - 集約層以外からの接続をハンドシェイクで拒否する
        # FR-002 / SC-010 / T120。kube-apiserver を経由せず、コントロールプレーンのノードから
        # Pod へ直接つなぐ。
        run: make e2e-handshake E2E_IMAGE="$E2E_IMAGE"

      - name: 実環境の検証 (直列に実行する)
        env:
          DPF_API_TOKEN: ${{ secrets.DPF_API_TOKEN }}
          DPF_API_TOKEN_2: ${{ secrets.DPF_API_TOKEN_2 }}
          DPF_TEST_ZONE: ${{ vars.DPF_TEST_ZONE }}
          DPF_API_ENDPOINT: ${{ vars.DPF_API_ENDPOINT }}
        run: make e2e-test E2E_IMAGE="$E2E_IMAGE"

      - name: 失敗時の記録
        if: failure()
        run: |
          kubectl -n cert-manager logs deploy/dpf-webhook --tail=500 || true
          kubectl get challenges,orders,certificates -A || true

      - name: クラスタの破棄
        if: always()
        run: make e2e-down
