# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webhook.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webhook.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "webhook.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secure-port={{ .Values.securePort }}
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: DPF_WEBHOOK_LOCK_OWNER
              value: {{ include "webhook.lockOwner" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $k, $v := dict "DPF_WEBHOOK_LOG_LEVEL" .Values.logLevel "DPF_WEBHOOK_EXPIRE_GRACE" .Values.expireGrace "DPF_WEBHOOK_EXPIRE_THRESHOLD" .Values.expireThreshold "DPF_WEBHOOK_OPERATION_DEADLINE" .Values.operationDeadline "DPF_WEBHOOK_LOCK_TTL" .Values.lockTTL "DPF_WEBHOOK_LOCK_WAIT" .Values.lockWait "OTEL_EXPORTER_OTLP_ENDPOINT" .Values.otlp.endpoint "OTEL_EXPORTER_OTLP_PROTOCOL" .Values.otlp.protocol }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            - name: NO_PROXY
              value: {{ printf "$(KUBERNETES_SERVICE_HOST)%s" (ternary (printf ",%s" $.Values.proxy.noProxy) "" (ne $.Values.proxy.noProxy "")) | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ .Values.securePort }}
              protocol: TCP
            - name: exposed
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: exposed
          readinessProbe:
            httpGet:
              path: /readyz
              port: exposed
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "webhook.fullname" . }}-tls
